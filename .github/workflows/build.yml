name: Build APK from zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build everything (logged)
        id: build
        continue-on-error: true
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/build-full.log"
          {
            echo "== environment"
            java -version
            echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
            echo "== unzip"
            unzip -q TTKGPSCam-source.zip && ls TTKGPSCam
            cd TTKGPSCam || exit 1
            chmod +x gradlew
            export JAVA_HOME="$JAVA_HOME_17_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
            echo "== gradle"
            ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
            echo "GRADLE_EXIT=$?"
          } > "$LOG" 2>&1
          echo "SCRIPT_DONE" >> "$LOG"
          grep -q "BUILD SUCCESSFUL" "$LOG"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TTK-GPS-Cam-debug-apk
          path: TTKGPSCam/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Publish build log to build-logs branch
        if: always()
        run: |
          mkdir -p /tmp/logs && cd /tmp/logs
          if [ -f "$GITHUB_WORKSPACE/build-full.log" ]; then
            tail -n 500 "$GITHUB_WORKSPACE/build-full.log" > build-log.txt
          else
            echo "No log file was created." > build-log.txt
          fi
          git init -q
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout -q -b build-logs
          git add build-log.txt
          git commit -q -m "Build log for run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
